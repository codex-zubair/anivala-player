name: watchanimetv
description: "AniLoom - a 100% offline, ad-free local anime & video player with Continue Watching, for Android and Android TV."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  provider: ^6.1.5+1
  shared_preferences: ^2.5.5
  video_player: ^2.14.1
  url_launcher: ^6.3.1
  permission_handler: ^13.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.6

flutter:
  uses-material-design: true
  assets:
    - assets/images/

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/app_icon.png"
  adaptive_icon_background: "#0B1120"
  adaptive_icon_foreground: "assets/images/app_icon_foreground.png"
  min_sdk_android: 23

flutter_native_splash:
  color: "#0B1120"
  image: assets/images/splash_logo.png
  android: true
  ios: false
  android_12:
    color: "#0B1120"
    image: assets/images/splash_logo.png
